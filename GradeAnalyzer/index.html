<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Analyzer</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
   <div class="container">

   <div class="form">
    

    <form id="form">
    
        <div class="name">
            <h4>Name:</h4>
            <input id ="name"type="text" placeholder="Name">
        </div>
        <div class="all_sub">


            <div class="subject">
                 <h4>
                    Math :
                 </h4>
                 <input id="math" type='number' placeholder="Marks in Math" required>
                
            </div>
             <div class="subject">
                 <h4>
                    Web PP :
                 </h4>
                 <input id="webpp" type='number' placeholder="Marks in Web PP" required>
                
            </div>
             <div class="subject">
                 <h4>
                    Python :
                 </h4>
                 <input  id="python"type='number' placeholder="Marks in  Python" required>
                
            </div>
             <div class="subject">
                 <h4>
                    Computer Network:
                 </h4>
                 <input  id= "cn"type='number' placeholder="Marks in Computer Network"required>
                
            </div>
        </div>
        

        <button type="submit">Submit</button>

    </form>

      </div>

   <div class="result"></div>

   </div>


   <script src="index.js"></script>
</body>
</html>
